name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [highest, lowest]
    name: check (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # The lowest leg verifies the runtime constraint claims, so it runs the
      # test suite only — lint and static analysis are pinned to the tool
      # versions we develop with and run on the highest leg.
      - run: composer ${{ matrix.dependencies == 'lowest' && 'test' || 'check' }}
